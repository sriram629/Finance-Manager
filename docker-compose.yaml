services:
  app:
    build: .
    ports:
      - "5050:5050"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: development
      SERVE_CLIENT: "true"
      PORT: "5050"
      CLIENT_URL: http://localhost:5050
      SERVER_URL: http://localhost:5050
      ALLOWED_ORIGINS: http://localhost:5050
